<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Are You a Robot?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-sized card, centered; a CAPTCHA gate, then one question per screen, then a verdict */
:root{
  --bg:#FFF3E8; --card:#FFFFFF; --ink:#15233A; --muted:#5D6677; --line:#F0D9C4;
  --navy:#15396C; --orange:#D9681A; --orange-soft:#FCE3CC;
  --ok:#1E7A55; --ok-soft:#DDF2E8; --bad:#B23A48; --bad-soft:#F8E1E4;
  --chip:#EEF2F9; --chip-ink:#15396C;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A24; --card:#1D2533; --ink:#EEF1F6; --muted:#A7B0C0; --line:#2C3647;
  --navy:#9DB8E8; --orange:#F0954A; --orange-soft:#3A2A1C;
  --ok:#5CC497; --ok-soft:#183328; --bad:#EE8590; --bad-soft:#3A1E24;
  --chip:#26324A; --chip-ink:#C8D8F5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A24; --card:#1D2533; --ink:#EEF1F6; --muted:#A7B0C0; --line:#2C3647;
  --navy:#9DB8E8; --orange:#F0954A; --orange-soft:#3A2A1C;
  --ok:#5CC497; --ok-soft:#183328; --bad:#EE8590; --bad-soft:#3A1E24;
  --chip:#26324A; --chip-ink:#C8D8F5; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.progress{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--orange);width:0;transition:width .3s}
.card{background:var(--card);border-radius:20px;padding:24px 20px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(21,57,108,.08);display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,46px);line-height:1.02;margin:0;text-wrap:balance;color:var(--navy)}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
.lede{color:var(--muted)}
.opt small{display:block;font-weight:400;font-size:13px;line-height:1.3;color:var(--muted);margin-top:4px}
.opt.right small,.opt.wrong small{color:inherit;opacity:.85}
.gloss{font-size:14px;color:var(--muted)}
.gloss summary{cursor:pointer;color:var(--navy);font-weight:700;font-size:15px}
.gloss ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.gloss b{color:var(--ink)}
/* the gate */
.gate{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg);cursor:pointer;font-size:18px;font-weight:700;user-select:none}
.gate:hover{border-color:var(--navy)}
.box{width:30px;height:30px;border:2.5px solid var(--muted);border-radius:6px;display:grid;place-items:center;flex:none;background:var(--card);transition:all .2s}
.gate.on .box{border-color:var(--ok);background:var(--ok)}
.box svg{opacity:0;transition:opacity .2s}
.gate.on .box svg{opacity:1}
.gate .cell{margin-left:auto;flex:none}
.small{font-size:14px;color:var(--muted)}
/* phenotype readout */
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pops{display:flex;flex-direction:column;gap:12px}
.pop{display:flex;flex-direction:column;gap:6px}
.pop-name{font-size:15px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-mono);font-weight:600;font-size:17px;padding:6px 11px;border-radius:8px;background:var(--chip);color:var(--chip-ink);font-variant-numeric:tabular-nums}
.chip b{color:var(--orange);font-weight:600}
.chip.neg{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.chip.neg b{color:var(--muted)}
.tag{align-self:flex-start;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--orange-soft);color:var(--orange)}
/* options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-weight:700;font-size:17px;padding:16px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:center;min-height:58px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.dim{opacity:.45}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;animation:rise .25s ease-out}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb strong{font-family:var(--f-display);font-size:19px}
.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--bad)}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:12px;padding:15px 20px;background:var(--navy);color:var(--card);cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
button:focus-visible,.gate:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
/* verdict */
.score{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:1;color:var(--orange);font-variant-numeric:tabular-nums}
.score span{font-size:32px;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.review li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.review .mk{font-family:var(--f-mono);font-weight:600;width:18px;flex:none}
.review .mk.y{color:var(--ok)} .review .mk.n{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
footer{font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">Pediatric AML · flow</span>
    <span class="progress" id="prog" hidden></span>
  </header>
  <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
  <section class="card" id="view"></section>
  <footer>Every phenotype in this game was found by a random forest, not by a person.</footer>
</main>

<script>
const BLAST = `<svg class="cell" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
  <circle cx="22" cy="22" r="20" fill="#9FB6DA" stroke="#6E86B8" stroke-width="1.5"/>
  <circle cx="21" cy="23" r="15" fill="#6A3A8A"/>
  <circle cx="16.5" cy="19.5" r="2.6" fill="#B996CF"/><circle cx="25" cy="26.5" r="2" fill="#B996CF"/>
  <line x1="33" y1="11" x2="37.5" y2="7.5" stroke="#C2185B" stroke-width="2.2" stroke-linecap="round"/></svg>`;

// plain-language names for non-specialists
const SUB = {
  "APL": "acute promyelocytic leukemia (PML::RARA)",
  "GATA1/TMD": "GATA1-mutated AML; transient abnormal myelopoiesis in Down syndrome",
  "CEBPA": "CEBPA-mutated AML",
  "KMT2A": "KMT2A-rearranged AML",
  "RUNX1": "RUNX1 rearrangement, mostly RUNX1::RUNX1T1 (t(8;21))",
  "UBTF": "UBTF tandem duplication",
  "NPM1": "NPM1-mutated AML",
  "CBFB": "CBFB::MYH11 fusion, inv(16)",
  "Healthy marrow": "normal pediatric bone marrow"
};
const MARK = {
  "CD42b": "platelet glycoprotein Ib, on megakaryocytes (platelet-forming cells)",
  "CD61": "platelet integrin β3, on megakaryocytes",
  "CD117": "KIT, a growth-factor receptor on immature myeloid cells",
  "CD34": "marker of stem and early progenitor cells",
  "CD7": "T-cell marker, unusual on myeloid blasts",
  "CD64": "Fc-gamma receptor I, high on monocytes",
  "HLA-DR": "MHC class II, on immature cells and monocytes; lost in promyelocytes",
  "NG2": "neural/glial antigen 2 (CSPG4), rarely on blood cells",
  "CD15": "carbohydrate marker of maturing granulocytes and monocytes",
  "CD19": "B-cell marker",
  "CD25": "IL-2 receptor α chain",
  "TdT": "terminal deoxynucleotidyl transferase, in immature lymphoid cells"
};
const Q = [
  { pops:[{name:"Blasts", m:["CD42b++","CD61++","CD117++"]}],
    opts:["APL","GATA1/TMD","CEBPA","KMT2A"], a:1,
    yes:"Human confirmed.", no:"Suspiciously robotic.",
    why:"CD42b and CD61 are platelet glycoproteins, so these are megakaryoblasts: GATA1-mutated AML, or transient abnormal myelopoiesis in Down syndrome." },
  { pops:[{name:"Blasts", m:["CD34++","CD7++"]}],
    opts:["RUNX1","UBTF","CEBPA","NPM1"], a:2,
    yes:"Human confirmed.", no:"Beep boop.",
    why:"A T-cell marker (CD7) on CD34+ HLA-DR+ myeloid blasts is the classic CEBPA-mutant pattern." },
  { pops:[{name:"Immature monocytes", m:["CD64++","HLA-DR+"]},{name:"plus", m:["NG2++","CD15++"]}],
    opts:["CBFB","NPM1","KMT2A","APL"], a:2,
    yes:"Human confirmed.", no:"Very machine-like.",
    why:"NG2 (CSPG4) on monocytic blasts is a classic pointer to a KMT2A rearrangement." },
  { pops:[{name:"Myeloid blasts", m:["CD34++","CD19+"]}],
    opts:["RUNX1","CEBPA","KMT2A","GATA1/TMD"], a:0,
    yes:"Human confirmed.", no:"Error 404: humanity not found.",
    why:"A B-lineage marker (CD19) on CD34+ myeloid blasts is typical of RUNX1::RUNX1T1, the most common RUNX1 rearrangement." },
  { pops:[{name:"Many cells", m:["CD117+","HLA-DR−","CD34−"]}],
    opts:["NPM1","UBTF","APL","GATA1/TMD"], a:2,
    yes:"Human confirmed.", no:"Forgivable, even for a human.",
    why:"CD117+ HLA-DR− CD34− promyelocytes mean APL. NPM1 is often HLA-DR− too, and the model mixes them up as well." },
  { pops:[{name:"Blasts", m:["CD25++","CD117++"]}], tag:"New candidate from this study",
    opts:["RUNX1","UBTF","CBFB","NPM1"], a:1,
    yes:"Impressively human.", no:"No shame, this one is new.",
    why:"UBTF tandem duplication. CD25 is also linked to FLT3-ITD, which often occurs alongside UBTF-TD, so this is a candidate that still needs validation." },
  { pops:[{name:"Lots of normal-looking B-cell precursors", m:["TdT+","CD34+","CD19+"]}],
    opts:["Healthy marrow","RUNX1","KMT2A","CEBPA"], a:0,
    yes:"Human confirmed.", no:"Congratulations, you think exactly like the model.",
    why:"These are hematogones: healthy pediatric marrow. The model learned them too, and that is its trap. A leukemia sample rich in B-cell precursors can get called healthy." }
];


// ---- Optional: also record each play in your Google Form (keeps the Form's stats) ----
// Fill these in from the Form's "Get pre-filled link" (see README). Leave FORM_ACTION empty to switch logging off.
const FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSf-eA566ssFdMtMFYgs5VjU0a5wuCuyc81OKPrUdGg-BUcD8Q/formResponse";
const ENTRY_CAPTCHA = "entry.2039739756";          // e.g. "entry.111111111"  (the "I'm not a robot" checkbox)
const ENTRY_Q = ["entry.135084228", "entry.1701996178", "entry.1537531125", "entry.942233302", "entry.586368298", "entry.1564110666", "entry.1823292769"];   // entry.xxx for questions 1–7, in order
function logToForm(){
  if (!FORM_ACTION) return;
  const fd = new FormData();
  if (ENTRY_CAPTCHA) fd.append(ENTRY_CAPTCHA, "I'm not a robot");
  Q.forEach((q, j) => { if (ENTRY_Q[j]) fd.append(ENTRY_Q[j], q.opts[picks[j]]); });
  fetch(FORM_ACTION, { method: "POST", mode: "no-cors", body: fd }).catch(() => {});
}

const $ = id => document.getElementById(id);
const view = $("view");
let i = 0, picks = [];

function chip(m){
  const k = m.match(/^(.*?)(\+\+|\+|−)$/);
  const neg = k && k[2] === "−";
  return `<span class="chip${neg ? " neg" : ""}">${k ? k[1] : m}<b>${k ? k[2] : ""}</b></span>`;
}

function start(){
  i = 0; picks = [];
  $("prog").hidden = true; $("barWrap").hidden = true;
  view.innerHTML = `
    <h1>Are you a robot?</h1>
    <p class="lede">A random forest learned these phenotypes from flow cytometry of pediatric acute myeloid leukemia (AML). Prove you're not one: name the genetic subtype from the cell phenotype.</p>
    <div class="gate" id="gate" role="checkbox" aria-checked="false" tabindex="0">
      <span class="box"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      I'm not a robot ${BLAST}
    </div>
    <p class="small">CD = cluster of differentiation, a marker on the cell surface. ++ much higher, + higher, − lower than a typical cell population.</p>
    <p class="small">7 phenotypes · about 2 minutes · anonymous.</p>`;
  const g = $("gate");
  const go = () => { if (g.classList.contains("on")) return; g.classList.add("on"); g.setAttribute("aria-checked","true"); setTimeout(ask, 550); };
  g.onclick = go; g.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); go(); } };
}

function ask(){
  const q = Q[i];
  $("prog").hidden = false; $("barWrap").hidden = false;
  $("prog").textContent = `${i + 1} / ${Q.length}`;
  $("bar").style.width = `${100 * i / Q.length}%`;
  view.innerHTML = `
    <span class="label">Phenotype</span>
    ${q.tag ? `<span class="tag">${q.tag}</span>` : ""}
    <div class="pops">${q.pops.map(p => `<div class="pop"><span class="pop-name">${p.name}</span><div class="chips">${p.m.map(chip).join("")}</div></div>`).join("")}</div>
    <h2>Which subtype is it?</h2>
    <details class="gloss"><summary>What do these markers mean?</summary><ul>${[...new Set(q.pops.flatMap(p => p.m.map(m => m.replace(/(\+\+|\+|−)$/, ""))))].map(m => `<li><b>${m}</b>: ${MARK[m] || ""}</li>`).join("")}<li><b>++ / + / −</b>: much higher / higher / lower than typical</li></ul></details>
    <div class="opts">${q.opts.map((o, k) => `<button class="opt" id="o${k}" data-k="${k}">${o}<small>${SUB[o] || ""}</small></button>`).join("")}</div>
    <div id="fbSlot"></div>`;
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
}

function answer(k){
  const q = Q[i], ok = k === q.a;
  picks[i] = k;
  view.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === q.a) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  $("bar").style.width = `${100 * (i + 1) / Q.length}%`;
  $("fbSlot").innerHTML = `
    <div class="fb ${ok ? "ok" : "no"}" role="status">
      <strong>${ok ? q.yes : q.no}</strong>
      <p>${ok ? "" : `It's <b>${q.opts[q.a]}</b>. `}${q.why}</p>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn" id="next">${i + 1 < Q.length ? "Next phenotype" : "See my verdict"}</button></div>`;
  $("next").focus({preventScroll:true});
  $("next").onclick = () => { i++; i < Q.length ? ask() : verdict(); };
}

function verdict(){
  logToForm();
  const s = picks.filter((p, j) => p === Q[j].a).length;
  const fellForTrap = picks[6] !== Q[6].a;
  const [title, line] =
    s >= 6 ? ["Human confirmed.", "You read flow cytometry better than most random forests."] :
    s >= 4 ? ["Probably human.", "A few robotic tendencies, but you'd pass most CAPTCHAs."] :
    s >= 2 ? ["Inconclusive.", "Could be a human, could be a decision tree in a trench coat."] :
             ["Robot detected.", "Beep boop. Come to the poster for a recalibration."];
  $("prog").textContent = "Done"; $("bar").style.width = "100%";
  view.innerHTML = `
    <span class="label">Verification result</span>
    <div class="score">${s}<span> / ${Q.length}</span></div>
    <h1 style="font-size:clamp(28px,8vw,38px)">${title}</h1>
    <p class="lede">${line}${fellForTrap ? " And on the last one you made exactly the mistake the model makes." : ""}</p>
    <ul class="review">${Q.map((q, j) => {
      const y = picks[j] === q.a;
      return `<li><span class="mk ${y ? "y" : "n"}">${y ? "✓" : "✗"}</span><span>${q.pops.map(p => p.m.join(" ")).join(" + ")} → <b>${q.opts[q.a]}</b></span></li>`;
    }).join("")}</ul>
    <p>Want to argue with the model? Come and find me at the poster.</p>
    <div class="row"><button class="btn ghost" id="again">Play again</button></div>`;
  $("again").onclick = start;
}

start();
</script>
</body>
</html>
